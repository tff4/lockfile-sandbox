# OSV-Scanner scan of this repository's dependency files, pushed to the findings service as `sandbox-osv`.
# Generated by Set up (AE2f): OSV-Scanner 2.7.0 (released 2026-10-12), downloaded and run only if its SHA-256
# matches; no third-party action. Secrets: INGEST_URL, INGEST_CLIENT_ID, INGEST_CLIENT_SECRET (the push step only).
name: scan-osv
on:
  push:
    branches: [ci-sbom]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner 2.7.0 (pinned and checked)
        env:
          SCANNER_URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o scanner "$SCANNER_URL"
          echo "$SCANNER_SHA256  scanner" | sha256sum -c -
          chmod +x scanner && ./scanner --version
      - name: Scan the dependency files
        run: 'rc=0; "$RUNNER_TEMP/scanner" scan source -r --format json --output-file "$RUNNER_TEMP/report.json" . || rc=$?; [ "$rc" -le 1 ]   # 1 = vulnerabilities found'
      - name: Push the report
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          CLIENT_ID: ${{ secrets.INGEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.INGEST_CLIENT_SECRET }}
        run: |
          if [ -z "$INGEST_URL" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "not configured: set INGEST_URL, INGEST_CLIENT_ID and INGEST_CLIENT_SECRET"; exit 0; fi
          curl --fail-with-body -sS -X POST "${INGEST_URL%/v1/sbom}/v1/scan/sandbox-osv" \
            -H "CF-Access-Client-Id: $CLIENT_ID" -H "CF-Access-Client-Secret: $CLIENT_SECRET" \
            -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/report.json"
