# Builds an SBOM of this repository's dependency files (synthetic, for testing) and pushes it to a findings service.
name: sbom
on:
  push:
    branches: [ci-sbom]
permissions:
  contents: read
jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Push the SBOM
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          CLIENT_ID: ${{ secrets.INGEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.INGEST_CLIENT_SECRET }}
        run: |
          if [ -z "$INGEST_URL" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "not configured: set INGEST_URL, INGEST_CLIENT_ID and INGEST_CLIENT_SECRET"; exit 0; fi
          curl --fail-with-body -sS -X POST "$INGEST_URL/sandbox-image" \
            -H "CF-Access-Client-Id: $CLIENT_ID" -H "CF-Access-Client-Secret: $CLIENT_SECRET" \
            -H "Content-Type: application/json" --data-binary @sbom.cdx.json
