# Grype scan of this repository's dependency files, pushed to the findings service as `sandbox-grype`.
# Generated by Set up (AE2f): Grype 0.121.0 (released 2026-10-19), downloaded and run only if its SHA-256
# matches; no third-party action. Secrets: INGEST_URL, INGEST_CLIENT_ID, INGEST_CLIENT_SECRET (the push step only).
name: scan-grype
on:
  push:
    branches: [ci-sbom]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Grype 0.121.0 (pinned and checked)
        env:
          SCANNER_URL: https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz
          SCANNER_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o scanner.tar.gz "$SCANNER_URL"
          echo "$SCANNER_SHA256  scanner.tar.gz" | sha256sum -c -
          tar -xzf scanner.tar.gz grype && mv grype scanner && rm scanner.tar.gz && ./scanner version
      - name: Scan the dependency files
        run: '"$RUNNER_TEMP/scanner" dir:. -o json --file "$RUNNER_TEMP/report.json"'
      - name: Push the report
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          CLIENT_ID: ${{ secrets.INGEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.INGEST_CLIENT_SECRET }}
        run: |
          if [ -z "$INGEST_URL" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "not configured: set INGEST_URL, INGEST_CLIENT_ID and INGEST_CLIENT_SECRET"; exit 0; fi
          curl --fail-with-body -sS -X POST "${INGEST_URL%/v1/sbom}/v1/scan/sandbox-grype" \
            -H "CF-Access-Client-Id: $CLIENT_ID" -H "CF-Access-Client-Secret: $CLIENT_SECRET" \
            -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/report.json"
